databases:
  - name: prflow-db
    databaseName: prflow_db
    user: postgres
    plan: free

services:
  # -------------------------------------------------------------
  # Backend API Web Service
  # -------------------------------------------------------------
  - type: web
    name: prflow-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DB_CONNECTION
        fromDatabase:
          name: prflow-db
          property: connectionString
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_REDIRECT_URI
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: SESSION_SECRET_KEY
        generateValue: true

  # -------------------------------------------------------------
  # Frontend Static Site
  # -------------------------------------------------------------
  - type: web
    name: prflow-frontend
    runtime: static
    rootDir: .
    buildCommand: "npm run build"
    staticPublishPath: "./dist"
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: prflow-backend
          property: host
      - key: VITE_BACKEND_URL
        fromService:
          type: web
          name: prflow-backend
          property: host

