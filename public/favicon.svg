<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <!-- Glowing gradients -->
    <linearGradient id="flowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </radialGradient>
    <!-- Shadow filters for glow effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Smooth rounded dark background container -->
  <rect width="32" height="32" rx="9" fill="url(#bgGrad)" />
  <rect x="0.5" y="0.5" width="31" height="31" rx="8.5" stroke="#334155" stroke-opacity="0.5" />

  <!-- Flow / Branching Lines -->
  <!-- Main stem (source branch) -->
  <path d="M 10 24 V 8" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round" />
  
  <!-- Branch split (pull request) -->
  <path d="M 10 17 C 14 17, 18 15, 22 11" stroke="url(#flowGrad)" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 22 11 V 8" stroke="#a855f7" stroke-width="2.5" stroke-linecap="round" />

  <!-- Interactive Nodes / Terminals -->
  <!-- Base node -->
  <circle cx="10" cy="24" r="2.5" fill="#1d4ed8" stroke="#3b82f6" stroke-width="1.5" />
  
  <!-- Main branch target -->
  <circle cx="10" cy="8" r="2.5" fill="#1d4ed8" stroke="#3b82f6" stroke-width="1.5" />
  
  <!-- Active PR branch node with glowing effect -->
  <circle cx="22" cy="8" r="3" fill="#a855f7" filter="url(#glow)" />
  <circle cx="22" cy="8" r="1.5" fill="#ffffff" />
</svg>
